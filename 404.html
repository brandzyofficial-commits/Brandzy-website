<!doctype html>
<html lang="en-IN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Page not found · Brandzy</title>
<meta name="robots" content="noindex" />
<link rel="icon" type="image/png" href="/assets/favicon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/compare.css" />
</head>
<body>
<header>
  <nav>
    <a class="logo" href="/"><img src="/assets/logo-mark.png" alt="" />Brandzy</a>
    <div class="nav-links">
      <a class="hide-sm" href="/pricing.html">Pricing</a>
      <a class="hide-sm" href="/app/">Sign in</a>
      <a class="btn" href="/app/?signup">Start free trial</a>
    </div>
  </nav>
</header>
<main>
  <h1>We couldn't find that page</h1>
  <p class="lede">The link may be old or mistyped. Creator pages live at <strong>brandzy.app/app/#/username</strong>.</p>
  <div class="cta">
    <a class="btn" href="/">Go to the Brandzy home page</a>
    <a class="btn btn-ghost" href="/app/">Sign in</a>
  </div>
</main>
<script>
  // Old share links used /username; send them to the creator's page in the app.
  (function () {
    var p = location.pathname.replace(/^\/+|\/+$/g, '');
    if (/^[a-z0-9._-]{2,40}$/i.test(p) && p.indexOf('.') === -1) location.replace('/app/#/' + p);
  })();
</script>
</body>
</html>
