<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Brandzy – Sign in</title>
    <meta name="robots" content="noindex">
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
    <link rel="manifest" href="/Brandzy-website/manifest.webmanifest">
    <meta name="theme-color" content="#121418">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Brandzy">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <script src="/Brandzy-website/install.js" defer></script>
    <style>
        html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
        #composeApplication { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div id="composeApplication"></div>
    <script>
        window.addEventListener('error', function (e) {
            console.error('GLOBAL ERROR', e.error || e.message);
        });
        window.addEventListener('unhandledrejection', function (e) {
            console.error('UNHANDLED REJECTION', e.reason);
        });
    </script>
    <script src="composeApp.js"></script>
</body>
</html>
