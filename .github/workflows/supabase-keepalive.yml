# Keeps the Supabase free-tier project from pausing (it pauses after 7 days
# without activity) by making a tiny read every 3 days.
# Uses the public anon key, which already ships in the web app.
name: Supabase keep-alive

on:
  schedule:
    - cron: "17 3 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query Supabase
        env:
          SUPABASE_URL: https://onypzbtzzilpxhleikgd.supabase.co
          SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9ueXB6YnR6emlscHhobGVpa2dkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAwODMzODYsImV4cCI6MjEwNTY1OTM4Nn0.BCmsjCa6qH7tjVMcPQx8Z-vZjFEznCmy5gMmQRWs9dI
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}"             "$SUPABASE_URL/rest/v1/creators?select=id&limit=1"             -H "apikey: $SUPABASE_ANON_KEY" -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          echo "Supabase responded $status"
          test "$status" = "200"
