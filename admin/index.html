<!doctype html>
<html lang="en-IN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>Brandzy Admin</title>
<link rel="icon" type="image/png" href="../assets/favicon.png" />
<style>
:root {
  --bg: #f6f7f9; --card: #ffffff; --text: #0f172a; --dim: #475569; --faint: #94a3b8; --border: #e2e8f0;
  --brand: #ff5b37; --brand-dark: #e8431f; --good: #16a34a; --warn: #d97706; --bad: #dc2626; --chip: #f1f5f9;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #0b0f17; --card: #131a26; --text: #e5e9f0; --dim: #a3adbd; --faint: #6b7586; --border: #243044; --chip: #1c2534; }
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
button, input, select, textarea { font: inherit; color: inherit; }
header { background: var(--card); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 10; }
.bar { max-width: 1200px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.logo { font-weight: 800; font-size: 17px; display: flex; align-items: center; gap: 8px; }
.logo img { width: 26px; height: 26px; }
.logo small { font-weight: 600; color: var(--brand-dark); font-size: 12px; background: var(--chip); padding: 2px 8px; border-radius: 99px; }
nav.tabs { display: flex; gap: 4px; flex-wrap: wrap; flex: 1; }
nav.tabs button { background: none; border: 0; padding: 7px 12px; border-radius: 8px; cursor: pointer; color: var(--dim); font-weight: 600; }
nav.tabs button.on { background: var(--chip); color: var(--text); }
.who { color: var(--dim); font-size: 13px; display: flex; gap: 10px; align-items: center; }
main { max-width: 1200px; margin: 0 auto; padding: 20px 16px 60px; }
.card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
h2 { font-size: 18px; margin-bottom: 12px; }
h3 { font-size: 15px; margin-bottom: 10px; }
.grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); }
.stat .k { color: var(--dim); font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .03em; }
.stat .v { font-size: 24px; font-weight: 800; margin-top: 2px; font-variant-numeric: tabular-nums; }
.stat .s { color: var(--faint); font-size: 12px; }
.row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.section { margin-top: 20px; }
.btn { border: 1px solid var(--border); background: var(--card); padding: 7px 14px; border-radius: 8px; cursor: pointer; font-weight: 600; }
.btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
.btn.primary:hover { background: var(--brand-dark); }
.btn:disabled { opacity: .5; cursor: default; }
input[type=text], input[type=email], input[type=password], input[type=number], input[type=date], select, textarea {
  border: 1px solid var(--border); background: var(--bg); border-radius: 8px; padding: 7px 10px; min-width: 0;
}
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); white-space: nowrap; }
th { color: var(--dim); font-size: 12px; font-weight: 600; }
tr.click { cursor: pointer; }
tr.click:hover td { background: var(--chip); }
.pill { display: inline-block; padding: 1px 8px; border-radius: 99px; font-size: 12px; font-weight: 700; background: var(--chip); color: var(--dim); }
.pill.pro { background: #ede9fe; color: #6d28d9; }
.pill.growth { background: #dcfce7; color: #15803d; }
.pill.trial { background: #fef3c7; color: #b45309; }
.pill.expired { background: #fee2e2; color: #b91c1c; }
@media (prefers-color-scheme: dark) {
  .pill.pro { background: #2e1f5e; color: #c4b5fd; } .pill.growth { background: #12351f; color: #86efac; }
  .pill.trial { background: #3a2a0c; color: #fcd34d; } .pill.expired { background: #3b1414; color: #fca5a5; }
}
.muted { color: var(--dim); }
.err { color: var(--bad); margin-top: 8px; }
.ok { color: var(--good); margin-top: 8px; }
.bars { display: flex; align-items: flex-end; gap: 3px; height: 120px; margin-top: 8px; }
.bars div { flex: 1; background: var(--brand); border-radius: 3px 3px 0 0; min-height: 2px; position: relative; }
.bars div:hover { background: var(--brand-dark); }
.axis { display: flex; justify-content: space-between; color: var(--faint); font-size: 11px; margin-top: 4px; }
.two { display: grid; gap: 12px; grid-template-columns: 1fr 1fr; }
@media (max-width: 760px) { .two { grid-template-columns: 1fr; } }
dl { display: grid; grid-template-columns: max-content 1fr; gap: 4px 14px; }
dt { color: var(--dim); }
dd { overflow-wrap: anywhere; }
.login { max-width: 360px; margin: 10vh auto; }
.login input { width: 100%; margin-top: 8px; }
.login .btn { width: 100%; margin-top: 12px; padding: 9px; }
.hidden { display: none !important; }
.back { background: none; border: 0; color: var(--brand-dark); cursor: pointer; font-weight: 600; margin-bottom: 10px; }
.actions .card { display: flex; flex-direction: column; gap: 8px; }
.actions label { font-size: 12px; color: var(--dim); font-weight: 600; }
pre { white-space: pre-wrap; font-size: 12px; color: var(--dim); }
</style>
</head>
<body>

<div id="login" class="login card hidden">
  <h2>Brandzy Admin</h2>
  <p class="muted">Sign in with your Brandzy account. Only accounts in the admin list can open this.</p>
  <form id="loginForm">
    <input id="email" type="email" placeholder="Email" autocomplete="username" required />
    <input id="password" type="password" placeholder="Password" autocomplete="current-password" required />
    <button class="btn primary" type="submit">Sign in</button>
  </form>
  <p id="loginErr" class="err"></p>
</div>

<div id="shell" class="hidden">
  <header>
    <div class="bar">
      <div class="logo"><img src="../assets/logo-mark.png" alt="" /> Brandzy <small>Admin</small></div>
      <nav class="tabs" id="tabs">
        <button data-tab="overview" class="on">Overview</button>
        <button data-tab="creators">Creators</button>
        <button data-tab="payments">Payments</button>
        <button data-tab="settings">Settings</button>
        <button data-tab="audit">Activity log</button>
      </nav>
      <div class="who"><span id="whoami"></span><button class="btn" id="signOut">Sign out</button></div>
    </div>
  </header>
  <main id="view"></main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL = "https://onypzbtzzilpxhleikgd.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9ueXB6YnR6emlscHhobGVpa2dkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAwODMzODYsImV4cCI6MjEwNTY1OTM4Nn0.BCmsjCa6qH7tjVMcPQx8Z-vZjFEznCmy5gMmQRWs9dI";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
  auth: { storageKey: "brandzy-admin-auth", persistSession: true, autoRefreshToken: true },
});

const $ = (id) => document.getElementById(id);
const view = $("view");
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const inr = (n) => "₹" + Math.round(Number(n) || 0).toLocaleString("en-IN");
const num = (n) => (Number(n) || 0).toLocaleString("en-IN");
const date = (s) => s ? new Date(s).toLocaleDateString("en-IN", { day: "numeric", month: "short", year: "numeric" }) : "—";
const dateTime = (s) => s ? new Date(s).toLocaleString("en-IN", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }) : "—";
const pill = (status) => `<span class="pill ${esc(status)}">${esc(status)}</span>`;

async function api(action, params = {}) {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { showLogin(); throw new Error("Please sign in."); }
  const res = await fetch(`${SUPABASE_URL}/functions/v1/admin-api`, {
    method: "POST",
    headers: { "Content-Type": "application/json", Authorization: `Bearer ${session.access_token}`, apikey: SUPABASE_ANON_KEY },
    body: JSON.stringify({ action, ...params }),
  });
  const body = await res.json().catch(() => ({}));
  if (res.status === 401) { await sb.auth.signOut(); showLogin("Your session ended. Please sign in again."); }
  if (!res.ok) throw new Error(body.error || `Request failed (${res.status})`);
  return body;
}

function showLogin(message = "") {
  $("shell").classList.add("hidden");
  $("login").classList.remove("hidden");
  $("loginErr").textContent = message;
}

async function enter() {
  try {
    const me = await api("me");
    $("whoami").textContent = me.email;
    $("login").classList.add("hidden");
    $("shell").classList.remove("hidden");
    go(location.hash.slice(1) || "overview");
  } catch (e) {
    await sb.auth.signOut();
    showLogin(e.message);
  }
}

$("loginForm").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  $("loginErr").textContent = "";
  const { error } = await sb.auth.signInWithPassword({ email: $("email").value.trim(), password: $("password").value });
  $("password").value = "";
  if (error) { $("loginErr").textContent = error.message; return; }
  enter();
});
$("signOut").addEventListener("click", async () => { await sb.auth.signOut(); showLogin(); });
$("tabs").addEventListener("click", (ev) => { const t = ev.target.closest("button"); if (t) go(t.dataset.tab); });
window.addEventListener("hashchange", () => { if (!$("shell").classList.contains("hidden")) go(location.hash.slice(1) || "overview", false); });

function go(route, push = true) {
  const [tab, arg] = route.split("/");
  if (push && location.hash.slice(1) !== route) { location.hash = route; return; }
  document.querySelectorAll("#tabs button").forEach((b) => b.classList.toggle("on", b.dataset.tab === tab));
  const pages = { overview, creators, creator: () => creatorPage(arg), payments, settings, audit };
  (pages[tab] || overview)();
}

function loading() { view.innerHTML = `<p class="muted">Loading…</p>`; }
function failed(e) { view.innerHTML = `<div class="card"><p class="err">${esc(e.message)}</p></div>`; }

// ---------- Overview ----------
async function overview() {
  loading();
  try {
    const o = await api("overview");
    const u = o.usage;
    const max = Math.max(1, ...o.signupsByDay.map((d) => d.n));
    const gmv = Object.entries(o.gmv).map(([c, v]) => c === "INR" ? inr(v) : `${c} ${num(v)}`).join(" + ") || "₹0";
    view.innerHTML = `
      <h2>Overview</h2>
      <div class="grid">
        ${stat("Paying creators", num(o.paying), `${o.growth} Growth · ${o.pro} Pro`)}
        ${stat("MRR", inr(o.mrr), "packs spread over their months")}
        ${stat("Revenue this month", inr(o.revenueMonth), "billing payments, incl. GST")}
        ${stat("Revenue all time", inr(o.revenueAll), `${o.paymentsCount} payments`)}
        ${o.revenueUsdAll ? stat("International (US$)", "US$" + num(o.revenueUsdAll), `US$${num(o.revenueUsdMonth)} this month · before Lemon Squeezy fees`) : ""}
        ${stat("On free trial", num(o.trial), "")}
        ${stat("Trial ended, not paid", num(o.expired), "")}
        ${stat("All creators", num(o.creators), `${o.published} pages published`)}
        ${stat("Sign-ups", num(o.signups7), `last 7 days · ${o.signups30} in 30 days`)}
        ${stat("Emails sent today", num(o.emailsToday), `of 100 a day on Resend Free · ${num(o.emailsMonth)} this month (3,000 limit)`)}
      </div>
      <div class="two section">
        <div class="card">
          <h3>Sign-ups, last 30 days</h3>
          <div class="bars">${o.signupsByDay.map((d) => `<div style="height:${(d.n / max) * 100}%" title="${esc(date(d.day))}: ${d.n}"></div>`).join("")}</div>
          <div class="axis"><span>${esc(date(o.signupsByDay[0].day))}</span><span>Today</span></div>
        </div>
        <div class="card">
          <h3>What creators are using</h3>
          <div class="table-wrap"><table><tbody>
            ${usageRow("Products in stores", u.products)}
            ${usageRow("Paid orders (fans)", u.ordersPaid, `GMV ${gmv}`)}
            ${usageRow("Orders waiting for UPI check", u.ordersWaiting)}
            ${usageRow("Brand inquiries", u.inquiries)}
            ${usageRow("Deals", u.deals)}
            ${usageRow("Invoices", u.invoices)}
            ${usageRow("Email subscribers", u.subscribers)}
            ${usageRow("Broadcasts sent", u.broadcasts)}
            ${usageRow("Active Auto DM rules", u.autodmRules, `${num(u.autodmSent)} DMs sent`)}
            ${usageRow("Instagram connected", u.igConnections)}
            ${usageRow("YouTube / TikTok connected", u.socialConnections)}
          </tbody></table></div>
        </div>
      </div>`;
  } catch (e) { failed(e); }
}
const stat = (k, v, s) => `<div class="card stat"><div class="k">${esc(k)}</div><div class="v">${esc(v)}</div><div class="s">${esc(s)}</div></div>`;
const usageRow = (k, v, s = "") => `<tr><td>${esc(k)}</td><td style="text-align:right"><b>${num(v)}</b></td><td class="muted">${esc(s)}</td></tr>`;

// ---------- Creators ----------
const creatorFilter = { q: "", status: "all", page: 0 };
async function creators() {
  view.innerHTML = `
    <h2>Creators</h2>
    <div class="row" style="margin-bottom:12px">
      <input id="q" type="text" placeholder="Search name, @username or email" value="${esc(creatorFilter.q)}" style="flex:1;min-width:200px" />
      <select id="status">
        ${["all", "trial", "growth", "pro", "expired"].map((s) => `<option value="${s}" ${s === creatorFilter.status ? "selected" : ""}>${s === "all" ? "All plans" : s}</option>`).join("")}
      </select>
    </div>
    <div id="list" class="card"><p class="muted">Loading…</p></div>`;
  let timer;
  $("q").addEventListener("input", () => { clearTimeout(timer); timer = setTimeout(() => { creatorFilter.q = $("q").value; creatorFilter.page = 0; loadCreators(); }, 300); });
  $("status").addEventListener("change", () => { creatorFilter.status = $("status").value; creatorFilter.page = 0; loadCreators(); });
  loadCreators();
}
async function loadCreators() {
  const list = $("list");
  try {
    const r = await api("creators", creatorFilter);
    const pages = Math.max(1, Math.ceil(r.total / r.pageSize));
    list.innerHTML = `
      <p class="muted" style="margin-bottom:8px">${num(r.total)} creators</p>
      <div class="table-wrap"><table>
        <thead><tr><th>Creator</th><th>Email</th><th>Plan</th><th>Until</th><th>Page</th><th>Joined</th></tr></thead>
        <tbody>${r.rows.map((c) => `
          <tr class="click" data-id="${esc(c.id)}">
            <td><b>${esc(c.name || "—")}</b> <span class="muted">@${esc(c.username)}</span></td>
            <td>${esc(c.email)}</td>
            <td>${pill(c.status)}</td>
            <td>${esc(date(c.status === "trial" ? c.trial_ends_at : c.paid_until))}</td>
            <td>${c.is_public && c.is_onboarded ? "Live" : '<span class="muted">Hidden</span>'}</td>
            <td>${esc(date(c.created_at))}</td>
          </tr>`).join("") || `<tr><td colspan="6" class="muted">No creators match.</td></tr>`}
        </tbody></table></div>
      <div class="row" style="margin-top:10px;justify-content:flex-end">
        <button class="btn" id="prev" ${r.page === 0 ? "disabled" : ""}>Previous</button>
        <span class="muted">Page ${r.page + 1} of ${pages}</span>
        <button class="btn" id="next" ${r.page + 1 >= pages ? "disabled" : ""}>Next</button>
      </div>`;
    list.querySelectorAll("tr.click").forEach((tr) => tr.addEventListener("click", () => go(`creator/${tr.dataset.id}`)));
    $("prev").onclick = () => { creatorFilter.page--; loadCreators(); };
    $("next").onclick = () => { creatorFilter.page++; loadCreators(); };
  } catch (e) { list.innerHTML = `<p class="err">${esc(e.message)}</p>`; }
}

// ---------- One creator ----------
async function creatorPage(id) {
  loading();
  try {
    const d = await api("creator", { id });
    const c = d.creator, a = d.account, u = d.usage;
    const in30 = new Date(Date.now() + 30 * 86400000).toISOString().slice(0, 10);
    view.innerHTML = `
      <button class="back" onclick="go('creators')">← All creators</button>
      <div class="row" style="justify-content:space-between;margin-bottom:12px">
        <h2 style="margin:0">${esc(c.name || c.username)} <span class="muted">@${esc(c.username)}</span> ${pill(c.status)}</h2>
        <a class="btn" href="https://brandzy.app/app/#/${encodeURIComponent(c.username)}" target="_blank" rel="noopener">Open public page</a>
      </div>
      <div class="two">
        <div class="card">
          <h3>Account</h3>
          <dl>
            <dt>Email</dt><dd>${esc(a?.email ?? c.email)}</dd>
            <dt>Signed up with</dt><dd>${esc(a?.provider ?? "—")}</dd>
            <dt>Email confirmed</dt><dd>${a?.email_confirmed_at ? esc(date(a.email_confirmed_at)) : "No"}</dd>
            <dt>Last sign-in</dt><dd>${esc(dateTime(a?.last_sign_in_at))}</dd>
            <dt>Joined</dt><dd>${esc(date(c.created_at))}</dd>
            <dt>Plan</dt><dd>${esc(c.subscription_tier ?? "FREE")}${c.paid_until ? ` until ${esc(date(c.paid_until))}` : ""}</dd>
            <dt>Trial ends</dt><dd>${esc(date(c.trial_ends_at))}</dd>
            <dt>Public page</dt><dd>${c.is_public ? "Published" : "Hidden"}${c.is_onboarded ? "" : " (setup not finished)"}</dd>
          </dl>
        </div>
        <div class="card">
          <h3>Usage</h3>
          <dl>
            <dt>Products</dt><dd>${num(u.products)}</dd>
            <dt>Paid orders</dt><dd>${num(u.ordersPaid)}</dd>
            <dt>Inquiries</dt><dd>${num(u.inquiries)}</dd>
            <dt>Deals</dt><dd>${num(u.deals)}</dd>
            <dt>Invoices</dt><dd>${num(u.invoices)}</dd>
            <dt>Email subscribers</dt><dd>${num(u.subscribers)}</dd>
            <dt>Auto DM rules</dt><dd>${num(u.autodmRules)}</dd>
            <dt>Connected</dt><dd>${[...d.instagram.map((i) => `Instagram @${esc(i.username)}`), ...d.social.map((s) => `${esc(s.platform)} ${esc(s.username ?? "")}${s.last_error ? " (error)" : ""}`)].join(", ") || "Nothing"}</dd>
          </dl>
        </div>
      </div>

      <div class="section"><h3>Change this account</h3>
        <div class="grid actions" style="grid-template-columns:repeat(auto-fill,minmax(260px,1fr))">
          <div class="card">
            <label>Set plan (for refunds, manual payments or comps)</label>
            <select id="tier">${["GROWTH", "PRO", "FREE"].map((t) => `<option ${t === (c.subscription_tier ?? "FREE") ? "selected" : ""}>${t}</option>`).join("")}</select>
            <label>Runs until</label>
            <input id="until" type="date" value="${esc((c.paid_until ?? "").slice(0, 10) || in30)}" />
            <input id="note" type="text" placeholder="Reason (saved in the activity log)" />
            <button class="btn primary" id="savePlan">Save plan</button>
          </div>
          <div class="card">
            <label>Extend the free trial</label>
            <input id="days" type="number" min="1" max="90" value="7" />
            <button class="btn" id="extend">Add days</button>
            <p class="muted" style="font-size:12px">Adds to whichever is later: today or the current trial end.</p>
          </div>
          <div class="card">
            <label>Public page</label>
            <p>${c.is_public ? "Visible to everyone." : "Hidden from everyone."}</p>
            <button class="btn" id="togglePublic">${c.is_public ? "Hide page" : "Publish page"}</button>
            <p class="muted" style="font-size:12px">Use for spam or reported pages.</p>
          </div>
        </div>
        <p id="actMsg"></p>
      </div>

      <div class="two section">
        <div class="card"><h3>Payments</h3>${paymentsTable(d.payments, false)}</div>
        <div class="card"><h3>Checkouts started</h3>${checkoutsTable(d.checkouts, false)}</div>
      </div>
      <div class="card section"><h3>Admin changes to this account</h3>${auditTable(d.log, false)}</div>`;

    const act = async (fn, okText) => {
      const msg = $("actMsg");
      msg.className = "muted"; msg.textContent = "Saving…";
      try { await fn(); msg.className = "ok"; msg.textContent = okText; setTimeout(() => creatorPage(id), 700); }
      catch (e) { msg.className = "err"; msg.textContent = e.message; }
    };
    $("tier").onchange = () => { $("until").disabled = $("tier").value === "FREE"; };
    $("tier").onchange();
    $("savePlan").onclick = () => {
      const tier = $("tier").value;
      if (!confirm(`Set @${c.username} to ${tier}${tier === "FREE" ? "" : " until " + $("until").value}?`)) return;
      act(() => api("set_plan", { id, tier, paid_until: tier === "FREE" ? null : $("until").value + "T23:59:59+05:30", note: $("note").value }), "Plan saved.");
    };
    $("extend").onclick = () => act(() => api("extend_trial", { id, days: Number($("days").value) }), "Trial extended.");
    $("togglePublic").onclick = () => {
      if (!confirm(c.is_public ? `Hide @${c.username}'s page from everyone?` : `Publish @${c.username}'s page?`)) return;
      act(() => api("set_public", { id, is_public: !c.is_public }), "Saved.");
    };
  } catch (e) { failed(e); }
}

function paymentsTable(rows, withCreator = true) {
  if (!rows.length) return `<p class="muted">No payments yet.</p>`;
  return `<div class="table-wrap"><table>
    <thead><tr><th>Paid</th>${withCreator ? "<th>Creator</th>" : ""}<th>Plan</th><th>Amount</th><th>Covers</th><th>Payment id</th></tr></thead>
    <tbody>${rows.map((p) => `<tr>
      <td>${esc(dateTime(p.paid_at))}</td>
      ${withCreator ? `<td>@${esc(p.creators?.username ?? "?")}</td>` : ""}
      <td>${esc(p.plan)}</td>
      <td>${p.currency === "INR" ? inr(p.amount) : esc(p.currency + " " + p.amount)}</td>
      <td>${esc(date(p.period_start))} – ${esc(date(p.period_end))}</td>
      <td class="muted">${esc(p.id)}</td></tr>`).join("")}</tbody></table></div>`;
}
function checkoutsTable(rows, withCreator = true) {
  if (!rows.length) return `<p class="muted">None.</p>`;
  return `<div class="table-wrap"><table>
    <thead><tr><th>Started</th>${withCreator ? "<th>Creator</th>" : ""}<th>Plan</th><th>Months</th><th>Amount</th><th>Status</th></tr></thead>
    <tbody>${rows.map((k) => `<tr>
      <td>${esc(dateTime(k.created_at))}</td>
      ${withCreator ? `<td>@${esc(k.creators?.username ?? "?")}</td>` : ""}
      <td>${esc(k.plan)}</td><td>${esc(k.months ?? "—")}</td><td>${k.amount != null ? inr(k.amount) : "—"}</td>
      <td>${pill(k.status)}</td></tr>`).join("")}</tbody></table></div>`;
}
function auditTable(rows, withCreator = true) {
  if (!rows.length) return `<p class="muted">Nothing yet.</p>`;
  return `<div class="table-wrap"><table>
    <thead><tr><th>When</th><th>Admin</th><th>Action</th>${withCreator ? "<th>Creator</th>" : ""}<th>Details</th></tr></thead>
    <tbody>${rows.map((r) => `<tr>
      <td>${esc(dateTime(r.created_at))}</td><td>${esc(r.admin_email)}</td><td><b>${esc(r.action.replace(/_/g, " "))}</b></td>
      ${withCreator ? `<td>${r.creator_id ? `<a href="#creator/${esc(r.creator_id)}">${esc(r.details?.username ? "@" + r.details.username : "open")}</a>` : "—"}</td>` : ""}
      <td style="white-space:normal;min-width:240px"><pre>${esc(describe(r))}</pre></td></tr>`).join("")}</tbody></table></div>`;
}
function describe(r) {
  const d = r.details || {};
  if (r.action === "set_plan") return `${d.from?.tier ?? "FREE"} → ${d.to?.tier}${d.to?.paid_until ? " until " + date(d.to.paid_until) : ""}${d.note ? "\n" + d.note : ""}`;
  if (r.action === "extend_trial") return `+${d.days} days, now ends ${date(d.to)}`;
  if (r.action === "update_settings") return Object.entries(d.to ?? {}).map(([k, v]) => `${k}: ${d.from?.[k]} → ${v}`).join("\n");
  return "";
}

// ---------- Payments ----------
let payPage = 0;
async function payments() {
  loading();
  try {
    const r = await api("payments", { page: payPage });
    const pages = Math.max(1, Math.ceil(r.total / r.pageSize));
    view.innerHTML = `
      <h2>Payments</h2>
      <div class="card"><h3>Subscription payments (${num(r.total)})</h3>${paymentsTable(r.payments)}
        <div class="row" style="margin-top:10px;justify-content:flex-end">
          <button class="btn" id="prev" ${payPage === 0 ? "disabled" : ""}>Previous</button>
          <span class="muted">Page ${payPage + 1} of ${pages}</span>
          <button class="btn" id="next" ${payPage + 1 >= pages ? "disabled" : ""}>Next</button>
        </div>
      </div>
      <div class="card section"><h3>Latest checkouts started</h3>
        <p class="muted" style="margin-bottom:8px">Checkouts that stay "created" are people who opened Cashfree and didn't pay. Worth a follow-up.</p>
        ${checkoutsTable(r.checkouts)}</div>`;
    $("prev").onclick = () => { payPage--; payments(); };
    $("next").onclick = () => { payPage++; payments(); };
  } catch (e) { failed(e); }
}

// ---------- Settings ----------
async function settings() {
  loading();
  try {
    const s = await api("settings");
    view.innerHTML = `
      <h2>Settings</h2>
      <div class="card" style="max-width:520px">
        <div class="actions" style="display:flex;flex-direction:column;gap:14px">
          <div><label for="trialDays">Free trial length for new sign-ups (days)</label><br />
            <input id="trialDays" type="number" min="1" max="60" value="${esc(s.trial_days)}" /></div>
          <div><label><input id="emailOn" type="checkbox" ${s.email_sending_enabled ? "checked" : ""} /> Email sending on (broadcasts, automations, receipts)</label>
            <p class="muted" style="font-size:12px">Turn off if Resend limits are hit or something is sending wrongly. Creators' emails queue until it is back on.</p></div>
          ${"international_billing_enabled" in s ? `<div><label><input id="intlOn" type="checkbox" ${s.international_billing_enabled ? "checked" : ""} /> International (US$) plans on</label>
            <p class="muted" style="font-size:12px">Shows "Outside India (US$)" in the plan picker, paid through Lemon Squeezy. Turn on only after Lemon Squeezy approves the store and the live keys are set. While off, admins can still test with ?intl=1.</p></div>` : ""}
          <button class="btn primary" id="saveSettings" style="align-self:flex-start">Save settings</button>
          <p id="setMsg"></p>
        </div>
      </div>
      <div class="card section" style="max-width:520px">
        <h3>Read-only</h3>
        <dl>
          <dt>Card/UPI before trial</dt><dd>${s.trial_requires_payment_method ? "Yes" : "No"}</dd>
          <dt>Instagram app id</dt><dd>${esc(s.instagram_app_id || "—")}</dd>
        </dl>
      </div>`;
    $("saveSettings").onclick = async () => {
      const msg = $("setMsg");
      try {
        const patch = { trial_days: Number($("trialDays").value), email_sending_enabled: $("emailOn").checked };
        if ($("intlOn")) patch.international_billing_enabled = $("intlOn").checked;
        await api("update_settings", patch);
        msg.className = "ok"; msg.textContent = "Saved.";
      } catch (e) { msg.className = "err"; msg.textContent = e.message; }
    };
  } catch (e) { failed(e); }
}

// ---------- Activity log ----------
async function audit() {
  loading();
  try {
    const r = await api("audit");
    view.innerHTML = `<h2>Activity log</h2><div class="card"><p class="muted" style="margin-bottom:8px">Every change made from this dashboard.</p>${auditTable(r.rows)}</div>`;
  } catch (e) { failed(e); }
}

sb.auth.getSession().then(({ data: { session } }) => session ? enter() : showLogin());
</script>
